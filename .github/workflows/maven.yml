name: Running Cucumber Tests

permissions:
  contents: read  # Required for checkout

on:
  workflow_dispatch: # allow manual runs too
    inputs:
      branch_name:
        description: 'The branch to run the workflow against'
        required: true
        default: 'main'
        type: string

  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        browser: [ chrome, edge, firefox ]
        screen-type: [ desktop, tablet, mobile ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code on branch ${{ inputs.branch_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_name }}

      # Set up JDK
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # Run Tests
      - name: Run Tests on ${{ matrix.browser }} in ${{ matrix.screen-type }}
        run: mvn clean test -Dbrowser=${{ matrix.browser }} -Dos=${{ matrix.os }} -DscreenType=${{ matrix.screen-type }}

      # Upload test report
      - name: Upload Test Report (${{ matrix.browser }}, ${{ matrix.screen-type }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExtentReports-${{ matrix.browser }}-${{ matrix.screen-type }}
          path: ./ExtentReports/
          if-no-files-found: warn
