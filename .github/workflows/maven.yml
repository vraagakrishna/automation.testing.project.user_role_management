name: Running Cucumber Tests

permissions:
  contents: read  # Required for checkout

on:
  workflow_dispatch:  # allow manual runs too

  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        browser: [ chrome, edge, firefox ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up JDK
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # Run Tests
      - name: Run Tests on ${{ matrix.browser }}
        run: mvn clean test -Dbrowser=${{ matrix.browser }} -Dos=${{ matrix.os }}

      # Upload test report
      - name: Update Test Report (${{ matrix.browser }})
        uses: actions/upload-artifact@v4
        with:
          name: ExtentReports-${{ matrix.browser }}/
          path: ExtentReports/
          if-no-files-found: warn

